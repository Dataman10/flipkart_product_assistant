apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask-container
          image: flask-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          # Secret must contain: ASTRA_DB_API_ENDPOINT, ASTRA_DB_APPLICATION_TOKEN,
          # ASTRA_DB_KEYSPACE, HUGGINGFACEHUB_API_TOKEN, GROQ_API_KEY
          envFrom:
            - secretRef:
                name: llmops-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
          # App loads an embedding model at startup, so give it time before routing traffic
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  type: LoadBalancer
  selector:
    app: flask
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
